<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meine Links</title>
<style>
  :root {
    --bg: #eaf1ef;
    --primary: #397D77;
    --primary-dark: #2b615c;
    --card: #ffffff;
    --text: #1d3634;
    --muted: #5f7a77;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  .logo {
    width: 150px;
    height: 150px;
    margin: 0 auto 22px;
    display: block;
    object-fit: contain;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
    color: var(--primary-dark);
    font-weight: 700;
  }

  p.subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 14px;
    margin: 0 0 36px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.link {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 2px solid var(--primary);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--primary-dark);
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  a.link:hover,
  a.link:focus-visible {
    transform: translateY(-2px);
    background: var(--primary);
    color: #ffffff;
    outline: none;
  }

  a.link .icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  footer {
    text-align: center;
    margin-top: 48px;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpg" alt="Logo">
    <h1>Project B04</h1>
    <p class="subtitle">Further Information</p>

    <nav class="links" id="linkList"></nav>

    <footer>Feel free to reach out to us!</footer>
  </main>

  <script>
    // ---------------------------------------------------------
    // HIER DEINE LINKS EINTRAGEN
    // icon: ein Emoji, label: sichtbarer Text, url: Ziel-Link
    // Zeilen kopieren, anpassen, fertig.
    // ---------------------------------------------------------
    const links = [
      { icon: "🌐", label: "Project Website", url: "https://www.trr419-sharp.de/de/projektbereiche/projektbereich-b/teilprojekt-b04" },
      { icon: "📄", label: "Poster References", url: "https://syncandshare.lrz.de/getlink/fiWmUdVfpvxuJLsCCiH3ff/References.pdf" },
    ];

    const list = document.getElementById("linkList");
    links.forEach(({ icon, label, url }) => {
      const a = document.createElement("a");
      a.className = "link";
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.innerHTML = `<span class="icon">${icon}</span><span>${label}</span>`;
      list.appendChild(a);
    });
  </script>
</body>
</html>
